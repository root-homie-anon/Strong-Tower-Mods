name: CI

# Run on every push to main and on every PR opened against main.
# We do not run on tag pushes — that's the release pipeline's job and
# does not yet exist.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same ref. PR
# branches get churned constantly; the second push should win and the
# first should not waste minutes finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # JavaScript / TypeScript side: Bun workspace + Prisma + bun:test
  # -------------------------------------------------------------------
  js:
    name: JS (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Provide the dev defaults the test suites read at startup. Mock
    # flags everywhere so no test ever needs a real API key. The
    # DATABASE_URL points at the SQLite file Prisma migrate deploy
    # creates below.
    env:
      DATABASE_URL: file:./dev.db
      ANTHROPIC_MOCK: "true"
      STRIPE_MOCK: "true"
      NEXUS_MOCK: "true"
      NEXUS_SSO_MOCK: "true"
      RANKER_MOCK: "true"
      MEMORY_MOCK: "true"
      AUTH_MOCK: "true"
      ELEVENLABS_MOCK: "true"
      # Long enough to satisfy the auth package's 32-char floor.
      JWT_SECRET: ci-test-jwt-secret-at-least-thirty-two-chars-long

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # Prisma client must be generated before tsc runs because the
      # repository imports types from prisma-client/index.js. The db
      # package's own build script does prisma generate + tsc --build;
      # we run it explicitly here so the rest of the workspace can
      # depend on the generated artifact.
      - name: Build @strong-tower/db (Prisma generate + migrate)
        working-directory: packages/shared/db
        run: |
          bun run db:deploy
          bun run build

      # Build the other shared packages whose dist/ is consumed by
      # tests in downstream packages. Companion-API's conftest in
      # audio-pipeline (if it ran here) reads dist/server.js, so we
      # build it. Auth + billing have no external test consumers but
      # we build them anyway so typecheck-clean is enforced.
      - name: Build shared packages
        run: |
          bun run --cwd packages/shared/auth build
          bun run --cwd packages/shared/billing build
          bun run --cwd packages/shared/api/companion build

      - name: Typecheck all workspaces
        run: bun run typecheck

      - name: Test @strong-tower/db
        working-directory: packages/shared/db
        run: bun test

      - name: Test @strong-tower/auth
        working-directory: packages/shared/auth
        run: bun test

      - name: Test @strong-tower/billing
        working-directory: packages/shared/billing
        run: bun test

      - name: Test @strong-tower/companion-api
        working-directory: packages/shared/api/companion
        run: bun test

      - name: Test @strong-tower/extension
        working-directory: packages/extension
        run: bun test

  # -------------------------------------------------------------------
  # Python side: uv + pytest for the companion sidecar.
  # Runs in parallel with the JS job; the audio-pipeline tests spawn
  # a Node subprocess that imports dist/server.js, so we still need
  # Node + the prebuilt cloud here.
  # -------------------------------------------------------------------
  py:
    name: Python (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ANTHROPIC_MOCK: "true"
      AUTH_MOCK: "true"
      ELEVENLABS_MOCK: "true"
      MEMORY_MOCK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun (for the workspace build only)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build companion-API (needed by audio-pipeline conftest)
        env:
          DATABASE_URL: file:./dev.db
        run: |
          bun run --cwd packages/shared/db db:deploy
          bun run --cwd packages/shared/db build
          bun run --cwd packages/shared/auth build
          bun run --cwd packages/shared/billing build
          bun run --cwd packages/shared/api/companion build

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.14"

      - name: Setup Python 3.11
        run: uv python install 3.11

      - name: Sync audio-pipeline deps
        working-directory: packages/companion/audio-pipeline
        run: uv sync

      - name: Pytest
        working-directory: packages/companion/audio-pipeline
        run: uv run pytest -v
