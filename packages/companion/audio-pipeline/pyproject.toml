[project]
name = "audio-pipeline"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "websockets==14.2",
    "httpx==0.28.1",
    "mempalace",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.uv.sources]
mempalace = { git = "https://github.com/milla-jovovich/mempalace.git" }

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "anyio[trio]==4.9.0",
    "pyinstaller>=6.20.0",
]
